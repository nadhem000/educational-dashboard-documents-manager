<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">
  <title>Text Studio · Documents Manager</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #0f172a;
      --surface: #334155;
      --border: #3f4d63;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, #1e293b, transparent 70%),
        var(--bg-1);
    }
    .app {
      width: 100%;
      max-width: 900px;
      background: rgba(30, 41, 59, .72);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      backdrop-filter: blur(10px);
    }
    .crumbs {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      align-items: center;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .crumbs a { color: var(--muted); text-decoration: none; transition: color .15s; }
    .crumbs a:hover { color: var(--accent); }
    .crumbs .current { color: var(--text); }

    h1 { margin: 0 0 .3rem; font-size: 1.45rem; letter-spacing: -.02em; }
    .subtitle { margin: 0 0 1.5rem; font-size: .88rem; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .card {
      display: block;
      position: relative;
      padding: 1.25rem 1.25rem 1.1rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform .12s, border-color .15s, background .15s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #3b4a60;
    }
    .card:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .2);
    }
    .card .icon {
      font-size: 1.6rem;
      line-height: 1;
      margin-bottom: .7rem;
      display: inline-block;
    }
    .card h2 {
      margin: 0 0 .35rem;
      font-size: 1.05rem;
      letter-spacing: -.01em;
    }
    .card p {
      margin: 0;
      font-size: .85rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .card .go {
      position: absolute;
      top: 1.15rem;
      right: 1.15rem;
      font-size: .95rem;
      color: var(--muted);
      transition: color .15s, transform .15s;
    }
    .card:hover .go {
      color: var(--accent);
      transform: translateX(3px);
    }
    .badge {
      display: inline-block;
      margin-left: .45rem;
      padding: .1rem .45rem;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: 999px;
      background: rgba(56, 189, 248, .14);
      color: var(--accent);
      vertical-align: middle;
    }
    .badge.soon {
      background: rgba(148, 163, 184, .14);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="crumbs">
      <a href="index.html">Documents Manager</a>
      <span>/</span>
      <span class="current">Text Studio</span>
    </nav>

    <h1>Text Studio</h1>
    <p class="subtitle">Tools for collecting and managing textual files.</p>

    <div class="grid">
      <a class="card" href="dm_textStudio_DC.html">
        <span class="go">→</span>
        <span class="icon">🗂️</span>
        <h2>Document Collector</h2>
        <p>Gather text files from a folder or paste-in, preview them, and keep them organised in one place.</p>
      </a>
      <!-- Add future Text Studio cards here:
      <a class="card" href="dm_textStudio_…"> … </a>
      -->
    </div>
  </main>
</body>
</html>
