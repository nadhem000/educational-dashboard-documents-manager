<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">

  <!-- ---------- PWA ---------- -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Docs Manager" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png" />
  <!-- -------------------------- -->

  <title>Documents Manager</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #0f172a;
      --surface: #334155;
      --border: #3f4d63;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, #1e293b, transparent 70%),
        var(--bg-1);
    }
    .app {
      width: 100%;
      max-width: 900px;
      background: rgba(30, 41, 59, .72);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 .3rem; font-size: 1.6rem; letter-spacing: -.02em; }
    .subtitle { margin: 0 0 1.75rem; font-size: .9rem; color: var(--muted); }
    .section-label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 .75rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .card {
      display: block;
      position: relative;
      padding: 1.35rem 1.35rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform .12s, border-color .15s, background .15s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #3b4a60;
    }
    .card:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .2);
    }
    .card .icon {
      font-size: 1.8rem;
      line-height: 1;
      margin-bottom: .8rem;
      display: inline-block;
    }
    .card h2 {
      margin: 0 0 .4rem;
      font-size: 1.1rem;
      letter-spacing: -.01em;
    }
    .card p {
      margin: 0;
      font-size: .85rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .card .go {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      font-size: 1rem;
      color: var(--muted);
      transition: color .15s, transform .15s;
    }
    .card:hover .go {
      color: var(--accent);
      transform: translateX(3px);
    }
    .empty {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      font-size: .88rem;
      color: var(--muted);
    }
    footer {
      margin-top: 2rem;
      font-size: .75rem;
      color: #64748b;
      text-align: center;
    }

    /* ---------- install button ---------- */
    .install-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin: 0 0 1.25rem;
      padding: .5rem .95rem;
      font: inherit;
      font-size: .85rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(56, 189, 248, .1);
      border: 1px solid rgba(56, 189, 248, .35);
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .08s;
    }
    .install-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, .18);
      border-color: var(--accent);
    }
    .install-btn:active:not(:disabled) { transform: translateY(1px); }
    .install-btn:disabled { opacity: .5; cursor: not-allowed; }
    .install-btn[hidden] { display: none; }

    /* ---------- PWA toast (updates / iOS hint) ---------- */
    .pwa-toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .7rem 1rem;
      font-size: .88rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
      z-index: 1000;
      max-width: calc(100vw - 2rem);
    }
    .pwa-toast-btn {
      font: inherit;
      font-size: .85rem;
      font-weight: 600;
      padding: .35rem .75rem;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
    }
    .pwa-toast-btn:hover {
      background: rgba(56, 189, 248, .12);
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Documents Manager</h1>
    <p class="subtitle">Your workspace — pick a tool to get started.</p>

    <button id="pwaInstallBtn" class="install-btn" hidden>⬇ Install App</button>

    <p class="section-label">Media &amp; Audio</p>
    <div class="grid">
      <a class="card" href="dm_voiceStudio.html">
        <span class="go">→</span>
        <span class="icon">🎧</span>
        <h2>Voice Studio</h2>
        <p>Speech and audio tools — text to speech, voice separation, and more to come.</p>
      </a>
      <!-- Add future top-level cards here:
      <a class="card" href="dm_…"> … </a>
      -->
    </div>
    <footer>Documents Manager · v0.1</footer>
  </main>

  <script>
    /* ============================================================
       Documents Manager — PWA glue (inline)
       ------------------------------------------------------------
       • Registers the service worker.
       • Shows an "Install" button when the browser offers one
         (Chrome / Edge / Android).
       • Shows an "Add to Home Screen" hint on iOS Safari, which
         has no beforeinstallprompt.
       • Surfaces a "new version available" toast when an updated
         service worker is waiting.
       ============================================================ */
    (function () {
      'use strict';

      if (!('serviceWorker' in navigator)) return;

      // ---------- service worker registration ----------
      let swRegistration = null;
      let updateToastShown = false;

      window.addEventListener('load', async () => {
        try {
          swRegistration = await navigator.serviceWorker.register('/sw.js', {
            scope: '/',
          });
          wireUpdateFlow(swRegistration);
        } catch (err) {
          console.warn('[pwa] service worker registration failed:', err);
        }
      });

      // ---------- update flow ----------
      function wireUpdateFlow(reg) {
        if (reg.waiting && navigator.serviceWorker.controller) {
          showUpdateToast(reg.waiting);
        }
        reg.addEventListener('updatefound', () => {
          const next = reg.installing;
          if (!next) return;
          next.addEventListener('statechange', () => {
            if (next.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateToast(next);
            }
          });
        });
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      }

      function showUpdateToast(worker) {
        if (updateToastShown) return;
        updateToastShown = true;
        const toast = document.createElement('div');
        toast.className = 'pwa-toast';
        toast.innerHTML =
          '<span>New version available.</span>' +
          '<button type="button" class="pwa-toast-btn">Reload</button>';
        document.body.appendChild(toast);
        toast.querySelector('button').addEventListener('click', () => {
          worker.postMessage({ type: 'SKIP_WAITING' });
          toast.remove();
        });
      }

      // ---------- install prompt (Chromium) ----------
      let deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallButton();
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        hideInstallButton();
        console.log('[pwa] installed');
      });

      // ---------- install button ----------
      function getButton() { return document.getElementById('pwaInstallBtn'); }
      function showInstallButton() { const b = getButton(); if (b) b.hidden = false; }
      function hideInstallButton() { const b = getButton(); if (b) b.hidden = true; }

      function wireInstallButton() {
        const btn = getButton();
        if (!btn) return;
        btn.addEventListener('click', async () => {
          if (deferredPrompt) {
            btn.disabled = true;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            btn.disabled = false;
            if (outcome === 'accepted') hideInstallButton();
            return;
          }
          showIosHint();
        });
      }

      function showIosHint() {
        const hint = document.createElement('div');
        hint.className = 'pwa-toast';
        hint.innerHTML =
          '<span>To install: tap <b>Share</b> → <b>Add to Home Screen</b>.</span>' +
          '<button type="button" class="pwa-toast-btn" aria-label="Close">✕</button>';
        document.body.appendChild(hint);
        hint.querySelector('button').addEventListener('click', () => hint.remove());
        setTimeout(() => hint.remove(), 8000);
      }

      // ---------- iOS detection ----------
      function isIosSafari() {
        const ua = window.navigator.userAgent;
        const isIos =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
        return isIos && isSafari;
      }

      // ---------- boot ----------
      function boot() {
        wireInstallButton();

        const standalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
        if (standalone) { hideInstallButton(); return; }

        if (isIosSafari()) showInstallButton();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
