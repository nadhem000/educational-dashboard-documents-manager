# ============================================================
# Documents Manager — Netlify configuration
# ============================================================

[build]
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ------------------------------------------------------------
# Function settings
# ------------------------------------------------------------
[functions]
  # Long neural TTS generations can exceed the 10s free-tier default.
  # 26s is the max on most paid plans; adjust to your plan.
  timeout = 26

# ------------------------------------------------------------
# Redirects
# ------------------------------------------------------------
[[redirects]]
  from   = "/api/tts"
  to     = "/.netlify/functions/tts"
  status = 200

# ------------------------------------------------------------
# Headers
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), camera=(), microphone=()"

# Service worker must never be cached by the browser or a proxy,
# otherwise clients get stuck on an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control          = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
    Content-Type           = "application/javascript; charset=utf-8"

# Manifest — short cache is fine, but revalidate so renames propagate.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/manifest+json; charset=utf-8"

# Icons — immutable; bump filenames if you redesign them.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always revalidate so users get fresh markup after a deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"